# Reusable: 把刚构建的镜像摘要提成基础设施仓的一个滚动 PR（防腐：逻辑只有一份）。
#
# 生产方仓构建并推完镜像后调用本工作流，它去改基础设施仓里钉着该镜像的那一行 tfvars，并把
# 改动提成一个**滚动 PR**（固定分支、强推更新），于是换版本始终是一次可审的提交，而不必有人
# 记得去手工改 tfvars。缘由与备选方案见
# https://github.com/UNILUME-AI/platform/issues/277
#
# 用法（调用方只留自己特有的部分）：
#
#   jobs:
#     handoff:
#       needs: [build-push, migrate]      # migrate 可无
#       # **用 always() 而不是 !cancelled()。** 目的是让「migrate 被并发闸顶掉取消」这件事能走到
#       # 下面的分诊里被大声报出来，而 `cancelled()` 是否把「被取消的依赖」也算进去，官方文档只
#       # 写了「workflow was canceled」、未覆盖这一情形。always() 在两种解读下都放行，故取它。
#       # 代价（可接受）：人工取消整个 run 之后、若构建已成功，本作业仍会跑。但提升与否是按主干
#       # 尖端判定的——那个提交既然已在 main 且是尖端，提升它本就正确，何况不会自动合并。
#       if: ${{ always() && needs.build-push.result == 'success' }}
#       # 按 commit SHA 钉（Sonar 供应链规则：可变的 @main 过不了门）。取 SHA：
#       #   gh api repos/UNILUME-AI/.github/commits/main --jq .sha
#       # 行尾不要写日期或版本注释：自家 reusable 没有版本 tag，Dependabot 会更新 SHA 而注释
#       # 原地不动，两者永久对不上（2026-08-11 已全 org 清理过一轮这种注释）。
#       uses: UNILUME-AI/.github/.github/workflows/reusable-promote-image.yml@<commit-sha>
#       with:
#         image:            ${{ needs.build-push.outputs.image }}
#         tfvars-path:      infra-substrate/aws/envs/dev/dev.tfvars
#         tfvars-key:       unilume_api_image
#         target-branch:    api-image/latest
#         pr-title-prefix:  'chore(aws/envs): dev 的 unilume-api 镜像摘要'
#         migration-result: ${{ needs.migrate.result }}   # 没有结构变更作业就别传
#         verify-hint:      '合并并 apply 之后 `curl -s https://api.dev.unilume.com/version` 应返回本 PR 标题里的那个提交。'
#       secrets:
#         # 显式传，不用 `secrets: inherit`——最小权限，且 Sonar 会标记无差别 inherit。
#         PROMOTE_TOKEN: ${{ secrets.SCRUM_TOKEN }}
#
# 调用方为什么还得自己写 needs / if（挪不进来）：
#   - `needs` 指的是调用方自己的作业名，本工作流看不见也管不着；
#   - 上游被**取消**时（并发组顶掉排队作业）`needs` 默认会把本作业一并跳过，那件事就此无声。
#     调用方用上面那个 `always()` 条件放行进来，本工作流再按 migration-result 分诊并大声失败。
#
# 令牌要求：对基础设施仓有写权限，且**不能用默认 GITHUB_TOKEN**——它既不能跨仓写，开的 PR 也
# 不触发任何 workflow（GitHub 的防循环机制），那样对方的必需 check 会永远停在 pending。

name: reusable promote image

on:
  workflow_call:
    inputs:
      image:
        description: >-
          镜像的摘要引用，形如 <仓库>/<名字>@sha256:…。必须是摘要不是标签：tfvars 按摘要钉。
          **留空 = 不换镜像，只把滚动 PR 重新基于基础设施仓当下的 main 建一遍**：沿用分支上已钉的
          那一版摘要与它原来的源提交。给构建作业在手动触发时被跳过的调用方用（镜像仓标签不可变，
          重推同一标签会被拒，故那些仓的手动入口不重新构建）。分支不存在＝没有待重建的东西，安静退出。
        type: string
        required: false
        default: ""
      tfvars-path:
        description: "基础设施仓里那份 tfvars 的仓内路径。"
        type: string
        required: true
      tfvars-key:
        description: "tfvars 里钉该镜像的变量名，如 unilume_api_image。找不到这一行即非零退出。"
        type: string
        required: true
      target-branch:
        description: "滚动 PR 的固定分支名，如 api-image/latest。每个消费方各用一条，不要共用。"
        type: string
        required: true
      pr-title-prefix:
        description: "PR 标题前半段；本工作流会接上「跟到 <生产方仓>@<短SHA>」。"
        type: string
        required: true
      migration-result:
        description: "结构变更作业的 result。留空 = 调用方没有这种作业，整段分诊不适用。"
        type: string
        required: false
        default: ""
      verify-hint:
        description: "追加到 PR 正文的一句验证提示。留空则不写。"
        type: string
        required: false
        default: ""
      platform-repo:
        description: "基础设施仓。"
        type: string
        required: false
        default: UNILUME-AI/platform
    secrets:
      PROMOTE_TOKEN:
        required: true

jobs:
  promote:
    name: 提 PR 更新镜像摘要
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 既不碰云也不检出调用方的仓：gh 与随后的 git push 全由 PROMOTE_TOKEN 认证，默认令牌一个
    # 动作都不参与，故一项权限都不授予。
    permissions: {}
    # 刻意不设并发闸：GitHub 每个并发组只保留一个 pending 作业，新的进来会顶掉排队那个，于是
    # 「旧的在跑、最新的排队、中间的进来」会把最新的丢掉。串行化改由推送处的比较并交换承担。
    steps:
      - name: 提 PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          IMAGE: ${{ inputs.image }}
          SHA: ${{ github.sha }}
          MIGRATION: ${{ inputs.migration-result }}
          PLATFORM_REPO: ${{ inputs.platform-repo }}
          TFVARS_PATH: ${{ inputs.tfvars-path }}
          TFVARS_KEY: ${{ inputs.tfvars-key }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          TITLE_PREFIX: ${{ inputs.pr-title-prefix }}
          VERIFY_HINT: ${{ inputs.verify-hint }}
        run: |
          set -euo pipefail
          repo=$PLATFORM_REPO
          # 生产方仓名，用于记号前缀与提交说明。取调用方的仓——workflow_call 里 github 上下文属调用方。
          producer=${GITHUB_REPOSITORY##*/}
          # 生产方仓的地址，用来把记号里那个提交号写成可点的链接。同样取调用方的仓。
          producer_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          # **只更 dev。** 环境梯队是 dev→qa→prod 逐级提升，越靠近生产越应当保持显式提升；
          # 其它环境何时提升由人决定，要跟进时手工改对应环境的 tfvars。
          file=$TFVARS_PATH
          short=${SHA:0:8}
          branch=$TARGET_BRANCH
          # **谁触发了这次运行**，与「这个镜像来自哪个提交」是两件事，平时相等，只有下面那条重建
          # 路径会把它们劈开。尖端判据问的是前者（本次运行是否仍代表主干尖端），记号、标题与新旧
          # 比对问的是后者。**同一个变量兼两种语义会让重建路径永不推送**：那时 SHA 被换成旧的产镜像
          # 提交，而尖端判据拿它去比 main 的尖端必然不等，于是在推送前退出——恰好是这条路径存在的
          # 前提（main 已前进）。故这里就分开。
          trigger_sha=$SHA


          # **取提交号的判据是形状，不是非空。** `gh api` 在 4xx/5xx 时把错误体写到 **stdout**
          # 而不是 stderr（实测：404 时 stdout 是 118 字节的 `{"message":"Not Found"…}`，退出码 1），
          # 于是 `2>/dev/null || true` 既挡不住它、也吞掉了退出码，「取到了非空值」因此不等于
          # 「取到了提交号」。拿那串 JSON 去比对必然不相等，得出的是「主干已前进」这种看着合理、
          # 实则凭空的结论——而这条路是静默 exit 0，正是 fail closed 要防的那种假绿。
          api_sha() { # $1=API 路径。成功打印 40 位提交号并返 0；失败返 1，诊断留在 /tmp/gh-err
            local out rc
            out=$(gh api "$1" --jq .sha 2>/tmp/gh-err)
            rc=$?
            if [ $rc -ne 0 ] || ! [[ "$out" =~ ^[0-9a-f]{40}$ ]]; then
              # 错误体在 stdout，报错信息只看 stderr 会漏掉真正有用的那半句，故两处并起来。
              printf '%s\n' "$out" >> /tmp/gh-err
              return 1
            fi
            printf '%s\n' "$out"
          }

          # **只有主干尖端才发布**，与 release-dev 的 `tip` 步骤同构。光靠 `needs: release-dev`
          # 不够：那个作业在自己不是尖端时会跳过全部迁移步骤并以成功结束，它的成功因此不等于
          # 迁移跑过。两道判据都不满足时谁也不发布，dev 停在上一个镜像与结构相互一致的版本上；
          # 恢复靠下一次合并，或手动触发本工作流。
          #
          # **在开头与每次推送前各判一次。** 只判开头的话，克隆与重试期间主干前进就没人再看，
          # 这个不变式于是只在开头成立——半执行的不变式比不执行更难推理。
          yield_unless_tip() {
            local tip
            # `local` 与赋值必须分两行：写成 `local tip=$(...)` 时 `$?` 是 `local` 的退出码，取值失败会被吞掉。
            tip=$(api_sha "repos/$GITHUB_REPOSITORY/commits/main") || {
              echo "::error::取不到主干尖端（$(head -c 200 /tmp/gh-err)），无法判断本次是否已被更新的提交取代，拒绝推送以免发布落后于结构变更的镜像"
              exit 1
            }
            if [ "$tip" != "$trigger_sha" ]; then
              echo "::notice::主干已前进到 ${tip:0:8}，本次（${trigger_sha:0:8}）不再发布，交给尖端那次"
              exit 0
            fi
          }
          yield_unless_tip

          # 结构变更的结果分诊。**放在尖端判据之后**：非尖端的那些运行本就该安静让出，只有尖端
          # 这一次的迁移没跑才值得报出来。cancelled = 被 release-dev 的并发组顶掉，迁移根本没执行
          # 且别处不会报，故大声失败；其余非 success 时那个作业自己已经是红的，这里只记一笔。
          # 入参为空 = 调用方没有结构变更作业（如 pipelines），整段不适用。
          if [ -n "$MIGRATION" ] && [ "$MIGRATION" != success ]; then
            if [ "$MIGRATION" = cancelled ]; then
              echo "::error::dev 的结构变更作业被取消，本次（$short）的迁移没有执行，故不发布镜像。重跑本工作流即可"
              exit 1
            fi
            echo "::notice::dev 的结构变更未成功（$MIGRATION），不发布镜像"
            exit 0
          fi

          # ── 读滚动分支与历史记号 ─────────────────────────────────────────────────
          #
          # **必须区分「查得到但没有记号」与「根本没查到」。** 两者都表现为空字符串，含义却相反：
          # 前者正常（首次运行，或分支已随上一轮合并被删而 main 的历史里尚无记号），后者是接口
          # 失败。若把失败当成前者，先后判定会被整块跳过，旧运行于是能拿旧摘要覆盖滚动分支。
          #
          # ⚠ **「分支不存在」的实测状态码是 422（`No commit found for SHA`）而不是 404**，而那正是
          # 滚动 PR 合并后（platform 开了合并即删分支）每次都会走到的路径。只放行 404 会让合并之后
          # 的第一次运行必然误判成接口故障。404 一并放行（仓或路径不存在）。
          #
          # 取值用 bash 自带正则而不是 `sed … | head -1`：后者在输入较大时会让 sed 吃到 SIGPIPE，
          # 而 pipefail 下那是退出码 141、会被当成查询失败（实测五千行即触发，回落那条查的是
          # per_page=100）。纯正则零子进程零管道，不存在这个问题。

          # 滚动分支的头。**sha、标题与记号必须同一次调用取回**：分两次读的话，两次之间分支可能已
          # 被别的运行推动，于是租约用的是新值、先后判的是旧记号，恰好把下面那道比较并交换绕过去。
          # 取某个提交上那份 tfvars 的内容。**按 sha 取是原子的**：问的就是那一个提交的那一份文件，
          # 不会读到之后被别人推上去的内容。确实不存在时输出为空并返 0，查询失败返 1。
          fetch_tfvars() { # $1=ref
            local c
            if c=$(gh api "repos/$repo/contents/$file?ref=$1" -H "Accept: application/vnd.github.raw" 2>/tmp/gh-err); then
              printf '%s\n' "$c"
              return 0
            fi
            case "$(cat /tmp/gh-err)" in
              *"HTTP 404"*|*"HTTP 422"*) return 0 ;;
            esac
            return 1
          }

          # 从一份 tfvars 内容里取本生产方的记号。
          #
          # **只认自动维护的那一整行，不是「文件里任何含 <生产方>@ 的地方」。** 宽匹配会把两类东西
          # 误数进来：镜像引用本身就可能长成 `<生产方>@sha256:…`（db-migrate 推的镜像仓正是这个
          # 名字，那一行必然命中），手写注释也可能顺手引用某个提交。误数的后果不是取错值而是判成
          # 歧义、每次提升都推不出去。下面 python 段用的就是锚定整行的正则，这里与它对齐。
          #
          # 多于一条才是真歧义，那时取首个是在猜，宁可停下。
          # **判据是行首前缀加其后的提交号，不是整行相等。** 记号之后还跟着指向该提交的链接
          # （见下面 python 段），故只取到第一个空格为止；前缀仍必须从行首起。子串匹配不够——
          # 注释里引用一句那行（前缀出现在行中）会被误数，而误数的后果是判成歧义、每次提升都推不出去。
          #
          # **链接之外的部分不校验。** 这里要回答的只是「能不能取到提交号判先后」，取到了就能判；
          # 记号后面写了什么都不影响这个判断，过严反而会把人手工补的说明判成异常而卡住提升。
          #
          # 不用正则做这件事：生产方名来自仓名，可能含 `.` `-` 这类正则元字符，拼进模式要转义，
          # 而转义漏一处就又变回宽匹配。用 `${line#"$prefix"}` 剥前缀是字面比较，没有这个问题。
          marker_in() { # $1=文件内容
            local prefix line rest sha n=0 bad=0 found=
            prefix="# 源提交（本行由 ${producer} 的发布流水线自动维护，取记号以它为准）：${producer}@"
            while IFS= read -r line; do
              # 剥不掉前缀 ⇒ 不是以它开头 ⇒ 与本记号无关（含行中引用的情形）。
              if [ "${line#"$prefix"}" = "$line" ]; then
                continue
              fi
              rest=${line#"$prefix"}
              # 记号后若跟着链接，取第一个空格之前的部分；没有空格时 `%% *` 原样返回。
              sha=${rest%% *}
              if [[ "$sha" =~ ^[0-9a-f]{7,}$ ]]; then
                n=$((n + 1)); found=$sha
              else
                # 以记号前缀开头、其后却不是提交号 ⇒ 有人手改过，无从判断先后。
                bad=1
              fi
            done <<< "$1"
            if [ "$bad" -eq 1 ]; then
              echo "::error::$file 里 $producer 的源提交记号取值异常，无法判断新旧" >&2
              return 1
            fi
            if [ "$n" -gt 1 ]; then
              echo "::error::$file 里有多条 $producer 的源提交记号，无法判断新旧" >&2
              return 1
            fi
            if [ "$n" -eq 1 ]; then
              printf '%s\n' "$found"
            fi
            return 0
          }

          read_branch() { # 成功返 0 并设置 branch_sha / branch_subject / branch_marker；查询失败返 1
            local body msg content
            if body=$(gh api "repos/$repo/commits/$branch" --jq '.sha, .commit.message' 2>/tmp/gh-err); then
              branch_sha=${body%%$'\n'*}
              msg=${body#*$'\n'}
              branch_subject=${msg%%$'\n'*}
              # **记号取分支头那个提交里的文件内容，不取提交说明。** 两者本来一致，但滚动分支上
              # 一旦有人工提交（例如有人在这个 PR 里附带别的修改），头部说明就不含记号，排序信号
              # 会在该分支上断掉。记号既然已经写进文件、与摘要同一次提交，就该一直从文件读。
              content=$(fetch_tfvars "$branch_sha") || return 1
              branch_marker=$(marker_in "$content") || return 1
              return 0
            fi
            case "$(cat /tmp/gh-err)" in
              *"HTTP 404"*|*"HTTP 422"*) branch_sha=; branch_subject=; branch_marker=; return 0 ;;
            esac
            return 1
          }

          # **分支被删不等于没有记号。** 新的一轮先跑完并被合并后 platform 会删掉分支，排在后面的
          # 旧运行于是在分支上查不到记号——若就此放行，它会拿旧摘要把滚动 PR 重建出来。合并把那一行
          # 源提交带进了 main 上的文件，故回落到读文件。
          #
          # **首次运行有一次性空窗**：当前这一版是人工钉上去的，文件里还没有那一行，于是两处都取不到
          # ⇒ 先后判定整块跳过 ⇒ 放行。方向是对的（第一次本就无历史可比，且放行只会把 dev 往主干尖端
          # 推），滚动 PR 一合并就在文件里留下记号，空窗自愈。
          # **从 main 上那份文件里读，不从提交说明读。** 记号与摘要写在同一次提交的同一个文件里，
          # 两者因此永远一致；而 squash 提交说明来自 PR 标题，标题的写入与分支的推送是两个动作，
          # 中间任何一次运行死掉都会让它与实际摘要对不上。
          main_marker() {
            local content
            content=$(fetch_tfvars main) || return 1
            marker_in "$content"
          }

          # ── image 留空：不换镜像，只把滚动 PR 重新基于当下的 main 建一遍 ────────────
          #
          # 沿用分支上已钉的那一版摘要**与它原来的源提交**——镜像既然一个字节都没变，把标题写成
          # 跟到当前 main 是不实的，而记号还要拿去和下一轮比新旧，改掉就与镜像对不上了。
          #
          # 分支不存在（上一轮已合并、随之被删）说明没有待重建的东西，安静退出而不是报错。
          if [ -z "$IMAGE" ]; then
            read_branch || {
              echo "::error::读滚动分支 $branch 失败：$(head -c 200 /tmp/gh-err)。无法判断有无待重建的摘要"
              exit 1
            }
            if [ -z "$branch_sha" ]; then
              echo "::notice::滚动分支 $branch 不存在，没有待重建的摘要，退出"
              exit 0
            fi
            content=$(fetch_tfvars "$branch_sha") || {
              echo "::error::读分支上的 $file 失败：$(head -c 200 /tmp/gh-err)"
              exit 1
            }
            # 与下面 python 段同一条判据（`^<键>\s*=\s*"…"$`），避免两处对「怎样算那一行」看法不一。
            IMAGE=$(printf '%s\n' "$content" | TFVARS_KEY="$TFVARS_KEY" python3 -c '
          import os, re, sys
          m = re.search("^" + re.escape(os.environ["TFVARS_KEY"]) + r"\s*=\s*\"(.*)\"$", sys.stdin.read(), re.M)
          print(m.group(1) if m else "")')
            if [ -z "$IMAGE" ] || [ -z "$branch_marker" ]; then
              echo "::notice::滚动分支 $branch 上没有可重建的摘要或记号，退出"
              exit 0
            fi
            # 源提交与短号都回退成分支上那一版，标题与记号因此与镜像一致。
            # **只改这两个，不动 trigger_sha**：尖端判据要问的仍是「本次运行是否代表主干尖端」，
            # 而本次触发的就是尖端；拿旧的产镜像提交去比会必然不等，把这条路径整个堵死。
            SHA=$branch_marker
            short=${branch_marker:0:8}
            echo "::notice::从 $branch 读回 $producer@$short 的摘要，将基于当下的 main 重建"
          fi

          # **`GH_TOKEN` 只认证 `gh` 自己，不会让随后的裸 `git push` 用上它。** `gh repo clone` 产出的
          # 是不含凭证的 HTTPS remote，不配凭证助手的话 push 以认证失败告终——而那个失败信息与
          # 「令牌权限不足」在外观上一致，极难分辨。
          gh auth setup-git

          # ── 克隆、改、判先后、以比较并交换的方式推送 ─────────────────────────────
          #
          # **整段放在重试循环里，克隆也在其中。** 提交必须基于 platform 当下的 main：若克隆之后
          # main 前进了（最常见的就是上一个滚动 PR 恰在此时被合入，那次改的正是同一行），本次提交
          # 的基底就是旧的，推上去会得到一个与 main 冲突、根本合不了的 PR，而记号与租约都察觉不到。
          # 故推之前再确认一次 main 没动，动了就带着新的 main 重来一遍。
          #
          # **不用并发闸做串行化。** GitHub 每个并发组只保留一个 pending 作业，新的进来会顶掉排队
          # 那个（`cancel-in-progress: false` 只护正在跑的那个）。于是「旧的 A 在跑、最新的 C 排队、
          # 中间的 B 进来」会把 C 丢掉。改用 git 自带的比较并交换：推送以「分支仍停在我刚读到的那个
          # 值」为条件（分支不存在时期望值为空串，语义是「必须仍不存在」，两种状态同一个参数覆盖）。
          # 谁都不会被丢弃；被别人抢先时重读重判，更旧的那一个自己会判出 behind 而退出。
          #
          # 三次为止：正常情况下第一次就成，重试是给相邻合并撞在一起的那几秒用的。连撞三次说明有
          # 异常的推送风暴，此时**大声失败**而不是默默放弃——默默放弃就是本作业要消灭的东西。
          pushed=
          for attempt in 1 2 3; do
            work=$(mktemp -d)
            gh repo clone "$repo" "$work" -- --depth=1 --quiet
            cd "$work"
            base=$(git rev-parse HEAD)

            # **只换那一行的值。** 用 python 而不是 sed：摘要里有 `/` 与 `@`，sed 的分隔符怎么选都要
            # 转义，而选错时它会静默改出一个语法仍然合法的文件。找不到那一行即非零退出——路径漂移
            # 过一次（pipelines 仓 2026-08-12），当时表现是镜像推成功、摘要没提上去，而构建全绿、
            # 定时任务照跑，跑的却是旧代码。
            state=$(python3 - "$file" "$IMAGE" "$SHA" "$TFVARS_KEY" "$producer" "$producer_url" <<'PYEOF'
          import pathlib, re, sys
          p, image, sha, key, producer, producer_url = pathlib.Path(sys.argv[1]), *sys.argv[2:7]
          s = p.read_text()
          img = re.compile('^(' + re.escape(key) + r'\s*=\s*)".*"$', re.M)
          if not img.search(s):
              sys.exit(f'{p} 里找不到 {key} 那一行')
          new = img.sub(lambda m: m.group(1) + '"' + image + '"', s, count=1)
          # 源提交与摘要写在同一次提交里，两者因此永远一致。放这里而不是放提交说明或 PR
          # 标题：那两处与文件内容不原子，任何一个运行在中途死掉都会让它们对不上，而下一轮
          # 正是靠它判断先后。
          #
          # **记号之后跟一条指向该提交的链接。** 这份文件被读到的绝大多数场合都不在 PR 里
          # （直接看仓、看 blame、本地打开），那时裸记号无从跟进——AGENTS.md 的注释规范要求
          # 引用来源就给链接。记号本身原样保留在前：它是上面 marker_in 与下面 mark 判先后的
          # 取值处，位置一动两处解析都要跟着改。
          head = f'# 源提交（本行由 {producer} 的发布流水线自动维护，取记号以它为准）：'
          line = f'{head}{producer}@{sha} {producer_url}/commit/{sha}'
          # 提交号之后的部分可有可无、有则不限内容，为的是认全上面 marker_in 认的那些行：
          #
          # - **接入链接之前写下的那些行**（其后什么都没有）；
          # - **记号后被人补过说明的行**（`<sha> <链接> 已人工核对` 这种）。读取侧取到第一个
          #   空格为止、其后一概不校验，写入侧但凡收窄一点，这类行就认不出来。
          #
          # 认不出的后果不是少改一行，而是**被再插一条**：同一份文件里于是有两条记号，下一轮
          # 直接判成歧义、四个消费方一起停摆，而读取侧一路都读得好好的，症状与原因隔了一轮。
          #
          # 用 ` .*` 而不是 `\s.*`：读取侧的 `${rest%% *}` 只按空格切，跟着用 `\s` 会把 tab 也
          # 认进来，那又是一处两侧不对齐。写成 non-capturing，好让下面的 findall 数的是整行
          # 而不是分组。
          mark = re.compile('^' + re.escape(head + producer) + r'@[0-9a-f]{7,}(?: .*)?$', re.M)
          # 记号按生产方而不是按键区分，故同一份文件里同一生产方只能有一条。今天的四个消费方
          # 各占一个键、互不同名，pipelines 的两个键还跨两份文件，所以撞不上。真撞上时**大声
          # 失败**而不是改错那一条——届时再决定是把记号按键限定，还是把键拆到不同文件。
          if len(mark.findall(new)) > 1:
              sys.exit(f'{p} 里有多条 {producer} 的源提交记号，无法判断该更新哪一条')
          if mark.search(new):
              new = mark.sub(lambda m: line, new, count=1)
          else:
              new = img.sub(lambda m: line + chr(10) + m.group(0), new, count=1)
          p.write_text(new)
          print('same' if new == s else 'changed')
          PYEOF
          )
            if [ "$state" = same ]; then
              echo "::notice::摘要与 platform 现有的一致，无需提 PR"
              exit 0
            fi

            git config user.name unilume-ci
            git config user.email ci@unilume.com
            git checkout -q -b "$branch"
            git commit -q -am "${TITLE_PREFIX}跟到 $producer@$short"

            read_branch || {
              echo "::error::读滚动分支 $branch 的记号失败：$(head -c 200 /tmp/gh-err)。无法确定与上一轮的先后，拒绝推送以免退回旧摘要；重跑本作业即可"
              exit 1
            }
            prev=$branch_marker
            if [ -z "$prev" ]; then
              prev=$(main_marker) || {
                echo "::error::读 main 上 $file 的历史记号失败：$(head -c 200 /tmp/gh-err)。同上，拒绝推送以免退回旧摘要"
                exit 1
              }
            fi

            if [ -n "$prev" ]; then
              # base...head 的 status 是 head 相对 base 而言。
              rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$SHA" --jq .status 2>/dev/null || true)
              # **白名单放行，其余一律 fail closed。** 这里判的是「能不能确定先后」，不是「要不要推」：
              # 接口因限流、网络或鉴权失败时 `rel` 取不到值，那是**信息缺失**而非放行许可。
              case "${rel:-}" in
                behind)
                  echo "::notice::本次源提交 $short 比分支上的 $prev 旧，跳过以免退回旧摘要"
                  exit 0
                  ;;
                # ahead=本次更新，照常推。
                #
                # **identical 也放行。** 同一个源提交覆盖自己不构成任何乱序风险，而早退会挡住恢复：
                # 推分支与建 PR 是两步，上一轮若在两步之间失败，分支留下了、PR 没建成，此后每次重跑
                # 都在这里退出，滚动 PR 永远缺席且全程无声。放行后落到下面本就幂等的 `gh pr list`，
                # 找不到 PR 就补建。手动触发因此也成了这种残局的恢复开关。
                #
                # diverged 只可能来自历史被重写，此时无从判断先后，按最新一次运行为准往下走。
                ahead|identical|diverged) ;;
                *)
                  echo "::error::无法确定 $prev 与 $short 的先后（compare 返回「${rel:-空}」），拒绝推送以免退回旧摘要；重跑本作业即可"
                  exit 1
                  ;;
              esac
            fi

            # 推之前重判一次：本轮若已被更新的提交取代，就此让出，别把旧摘要推上去。
            yield_unless_tip

            main_now=$(api_sha "repos/$repo/commits/main") || {
              echo "::error::取不到 platform 的 main 尖端（$(head -c 200 /tmp/gh-err)），无法确认本次提交的基底是否仍然当前，拒绝推送以免开出合不了的 PR"
              exit 1
            }
            if [ "$main_now" != "$base" ]; then
              echo "::notice::platform 的 main 在克隆之后前进到 ${main_now:0:8}，基于新的 main 重来一次"
              continue
            fi

            # 强推本身是要的语义：本次提交基于 platform 当下的 main，与分支上残留的上一轮除了共同
            # 祖先之外没有关系。**只对这条分支成立**——platform 只对默认分支设了禁止非快进与禁止
            # 删除的规则，其余分支不受保护。
            if git push -q --force-with-lease="refs/heads/$branch:$branch_sha" origin "HEAD:refs/heads/$branch"; then
              # **推完再验一次基底。** 租约只约束 `refs/heads/$branch` 的旧值，管不到 main；上面那次
              # 确认与本次推送之间 main 仍可能前进，而若它改的正是同一行，这条分支就带着过期基底、
              # 开出一个合不了的 PR。改用新的 main 重来一遍即可——重推的是同一行值，无副作用。
              after=$(api_sha "repos/$repo/commits/main") || {
                echo "::error::推送后取不到 platform 的 main 尖端（$(head -c 200 /tmp/gh-err)），无法确认基底仍然当前；请人工核对滚动 PR 是否有冲突"
                exit 1
              }
              if [ "$after" != "$base" ]; then
                echo "::notice::推送后发现 platform 的 main 已前进到 ${after:0:8}，基于新的 main 重做一遍"
                continue
              fi
              pushed=1
              break
            fi
            echo "::notice::第 $attempt 次推送被抢占（分支在读取之后被改动），重读记号后再判先后"
          done
          if [ -z "$pushed" ]; then
            echo "::error::连续三次未能推上去（被抢占或 platform 的 main 一直在动），放弃本轮。请查看是否有异常的重复触发"
            exit 1
          fi

          # ── PR 的标题与正文：从分支头派生，写完复核，不一致就重写 ─────────────
          #
          # 不变式：**PR 的元数据必须描述分支上当下那一版**。推送受租约保护而元数据不受，故取值
          # 一律读分支头，写完再读一次核对；期间分支被改动就按新的分支头重写。
          metadata_ok=
          for attempt in 1 2 3; do
            read_branch || {
              echo "::error::读分支头以派生 PR 元数据失败：$(head -c 200 /tmp/gh-err)"
              exit 1
            }
            snapshot=$branch_sha
            title=$branch_subject

            cat > /tmp/pr-body.md <<'BODYEOF'
          由生产方仓的一次主干合并自动提出，只改本环境 tfvars 里的镜像摘要，以及它上面那行
          自动维护的「源提交」。具体是哪个文件、哪一行，看下面的 diff。

          源提交与摘要写在同一次提交里，两者因此永远一致；下一轮判断新旧就读这一行。
          ⚠️ 若这份 tfvars 里还留着**手写的、记录源提交的注释**（接入自动提升之前那种），
          它自本次起不再有人更新，建议一并删掉或改写，免得日后与自动维护的那行各说各话。

          **只动这一个环境。** 其它环境何时提升由人决定，要跟进时手工改对应环境的 tfvars。

          **本 PR 是滚动的**：生产方每合一次主干就更新到最新摘要，因此任何时候最多
          只有这一个待合。合并后分支被删，下次合并重新开。

          ⚠️ **这条分支会被下次更新整个覆盖**——每一轮都是从本仓 main 重新克隆、改一行、再强推，
          分支上多出来的提交不会被保留。要在本 PR 里附带别的修改是可以的，但**必须赶在生产方
          下次合并主干之前合掉**，否则会随覆盖一起丢失；更稳妥的做法是另开一个 PR 改 main。

          **合并前它不会生效**——dev 上跑的仍是 platform 当前钉的那一版。这正是要的：
          换版本是一次可审的提交。合并会触发本仓基础设施部署工作流里 `aws-dev` 那个作业的
          apply（`.github/workflows/infra-deploy.yml`），那次 apply 即一次滚动发布。

          BODYEOF
            # 源提交也取分支上的记号，理由同上：正文必须描述分支上那一版，不是本轮这一版。
            if [ -n "$branch_marker" ]; then
              printf '\n来源提交：%s/%s/commit/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch_marker" >> /tmp/pr-body.md
            fi

            # `.[0].number` 在空数组上求值出 `null`，gh 会照字面打印出来——`[ -n "$num" ]` 于是
            # 恒真，走进 edit 分支去改一个不存在的 PR。`// empty` 让它真的为空。
            if [ -n "$VERIFY_HINT" ]; then
              printf '\n验证：%s\n' "$VERIFY_HINT" >> /tmp/pr-body.md
            fi

            num=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$num" ]; then
              gh pr edit --repo "$repo" "$num" --title "$title" --body-file /tmp/pr-body.md
            else
              gh pr create --repo "$repo" --head "$branch" --base main \
                --title "$title" --body-file /tmp/pr-body.md
            fi

            read_branch || {
              echo "::error::写入 PR 元数据后复核分支头失败：$(head -c 200 /tmp/gh-err)。元数据可能与分支内容不符，重跑本作业即可"
              exit 1
            }
            if [ "$branch_sha" = "$snapshot" ]; then
              metadata_ok=1
              echo "::notice::platform 的滚动 PR 已更新到 ${branch_marker:-分支当前版本}"
              break
            fi
            echo "::notice::写入元数据期间分支被更新的一轮改动，按新的分支头重写一次"
          done
          if [ -z "$metadata_ok" ]; then
            echo "::error::连续三次在写入元数据期间分支都被改动，放弃。PR 的标题与正文可能与分支内容不符，重跑本作业即可"
            exit 1
          fi
