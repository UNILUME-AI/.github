# Reusable: AI unit-test generation + gate (EPIC-0002 F1), shared via workflow_call.
# Productionizes the unilume-lab spike. Generates Vitest tests FROM acceptance criteria (AC) +
# an interface signature (never the implementation), verifies fail-first (red against a throwing
# stub), runs them against the real impl, commits the test back, and gates per the Feature's
# `verification` declaration. Gen script + central config live once in `harness` (checked out here).
#
# Caller (business repo) example:
#   jobs:
#     ai-tests:
#       uses: UNILUME-AI/.github/.github/workflows/reusable-ai-unit-tests.yml@main
#       with:
#         work_dir: prototypes/ai-tests-kimi
#         ac_file: docs/requirements/discount.md
#         iface_file: src/discount.iface.ts
#         out_file: src/discount.test.ts
#         module_path: src/discount.ts
#         module_import: ./discount
#         verification: advisory          # required | advisory | skip
#         model_tier: default             # (可选) default 低成本 | fast 提速;模型名在 harness 中央配置
#       secrets:
#         MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
#         HARNESS_TOKEN: ${{ secrets.SCRUM_TOKEN }}   # PAT with harness Contents:read
#
# Constraints (keep callers honest):
#   - iface_file must declare FLAT function signatures: `export [declare] function NAME(...): T;`
#     (one terminating `;` per signature). Arrow/const exports (`export const f = (...) => …`) are
#     not stubbed — fail-first then errors loudly (nothing to stub) instead of degrading silently.
#   - test_cmd is run as argv (whitespace-split), not via a shell: no pipes / && / redirection.
name: reusable-ai-unit-tests

on:
  workflow_call:
    inputs:
      work_dir:      { type: string, required: true }
      ac_file:       { type: string, required: true }
      iface_file:    { type: string, required: true }
      out_file:      { type: string, required: true }
      module_path:   { type: string, required: true }
      module_import: { type: string, required: true }
      verification:  { type: string, default: "advisory" }
      test_cmd:      { type: string, default: "npx vitest run" }
      model_tier:    { type: string, default: "default" }   # 选 config/ai-tests.yml generation.model.<tier>:default(低成本)| fast(提速);未知键回退 default
    secrets:
      MOONSHOT_API_KEY: { required: true }
      HARNESS_TOKEN:    { required: true }

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-unit-tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-unit-tests:
    if: ${{ inputs.verification != 'skip' && (github.event_name != 'pull_request' || github.event.pull_request.merged != true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          case "$VERIFICATION" in
            required|advisory|skip) ;;
            *) echo "::error::invalid verification: '$VERIFICATION' (expected required|advisory|skip)"; exit 1 ;;
          esac

      - name: Checkout caller (Feature code + AC)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1

      - name: Checkout harness (config + gen script — single source)
        uses: actions/checkout@v4
        with:
          repository: UNILUME-AI/harness
          path: _harness
          token: ${{ secrets.HARNESS_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load central config → env
        env:
          MODEL_TIER: ${{ inputs.model_tier }}   # 经 env 传入,不插值进脚本(防注入)
        run: |
          # PyYAML ships on ubuntu-latest; only install if absent (saves ~15s most runs).
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, sys, yaml
          g = yaml.safe_load(open("_harness/config/ai-tests.yml"))["generation"]
          models = g["model"]
          tier = os.environ.get("MODEL_TIER") or "default"
          model = models.get(tier)
          if not model:
              print(f"::warning::unknown model_tier '{tier}', falling back to default", file=sys.stderr)
              model = models["default"]
          print(f"MOONSHOT_BASE_URL={g['base_url']}")
          print(f"MOONSHOT_MODEL={model}")
          print(f"GEN_MAX_TOKENS={g.get('max_tokens', 32768)}")
          print(f"GEN_TIMEOUT_SECONDS={g.get('timeout_seconds', 300)}")
          PY

      - name: Generate tests from AC (provider-agnostic)
        id: gen
        working-directory: ${{ inputs.work_dir }}
        # gen-tests.mjs uses only Node built-ins (node:fs + global fetch/AbortController), so it
        # needs no node_modules — running before `npm ci` is intentional: fail fast on a gen/API
        # error before paying the install cost.
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          AC_FILE: ${{ inputs.ac_file }}
          IFACE_FILE: ${{ inputs.iface_file }}
          OUT_FILE: ${{ inputs.out_file }}
          MODULE_IMPORT: ${{ inputs.module_import }}
        run: node "$GITHUB_WORKSPACE/_harness/scripts/gen-tests.mjs"

      - name: Install deps
        working-directory: ${{ inputs.work_dir }}
        run: npm ci || npm install --no-audit --no-fund

      - name: fail-first (tests must be red against a throwing stub)
        id: failfirst
        working-directory: ${{ inputs.work_dir }}
        env:
          IFACE: ${{ inputs.iface_file }}
          MODULE: ${{ inputs.module_path }}
          TEST_CMD: ${{ inputs.test_cmd }}
        run: |
          set -u
          cp "$MODULE" "$RUNNER_TEMP/impl.head"
          # derive a throwing stub from the flat interface declarations; fail loudly if none match
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync(process.env.IFACE, "utf8");
            let n = 0;
            const stub = src.replace(/export\s+(?:declare\s+)?function\s+(\w+)\s*\([^;]*?;/g,
              (_m, name) => { n++; return `export function ${name}(...args){throw new Error("fail-first stub");}`; });
            if (n === 0) {
              console.error("fail-first: no `export [declare] function NAME(...);` signature found in " +
                process.env.IFACE + " — nothing to stub (arrow/const exports unsupported).");
              process.exit(1);
            }
            fs.writeFileSync(process.env.MODULE, stub);
            console.error("fail-first: stubbed " + n + " function(s)");
          '
          read -ra CMD <<< "$TEST_CMD"
          if "${CMD[@]}" >"$RUNNER_TEMP/ff.log" 2>&1; then
            echo "::error::fail-first violated — generated tests PASS against a throwing stub (not constraining behavior)"
            cp "$RUNNER_TEMP/impl.head" "$MODULE"
            exit 1
          fi
          echo "fail-first OK — tests are red against the stub"
          cp "$RUNNER_TEMP/impl.head" "$MODULE"

      - name: Commit generated tests back to the PR
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ inputs.work_dir }}
        env:
          GH_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OUT_FILE: ${{ inputs.out_file }}
        run: |
          git add "$OUT_FILE"
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "ai-tests[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ai-gen): 依 AC 生成单测 [ai-gen]"
          git push "https://x-access-token:${GH_TOKEN_PUSH}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - name: Run tests against the real implementation + gate
        id: gate
        working-directory: ${{ inputs.work_dir }}
        env:
          VERIFICATION: ${{ inputs.verification }}
          TEST_CMD: ${{ inputs.test_cmd }}
        run: |
          set -u
          read -ra CMD <<< "$TEST_CMD"
          if "${CMD[@]}"; then
            echo "tests green against the real implementation"
            echo "TEST_OUTCOME=pass" >> "$GITHUB_ENV"
          else
            echo "TEST_OUTCOME=fail" >> "$GITHUB_ENV"
            if [ "$VERIFICATION" = "required" ]; then
              echo "::error::required gate — tests fail against the implementation"
              exit 1
            fi
            echo "::warning::tests fail but verification=$VERIFICATION (advisory) — not blocking"
          fi

      - name: Report to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          VERIFICATION: ${{ inputs.verification }}
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          FF_OUTCOME: ${{ steps.failfirst.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -u
          # TEST_OUTCOME (pass|fail) is exported by the gate step via GITHUB_ENV; earlier-stage
          # failures (gen/fail-first) are read from step outcomes so the comment never lies.
          if [ "$GEN_OUTCOME" != "success" ]; then
            status="测试生成失败"
          elif [ "$FF_OUTCOME" != "success" ]; then
            status="fail-first 未通过(测试对 throwing stub 未变红,或接口无可 stub 的签名)"
          elif [ "${TEST_OUTCOME:-}" = "pass" ]; then
            status="对实现执行通过"
          elif [ "${TEST_OUTCOME:-}" = "fail" ]; then
            status="对实现执行未通过(verification=$VERIFICATION)"
          else
            status="未执行到门禁(详见 job 日志)"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "AI 单测(verification=$VERIFICATION):依 AC 生成 + fail-first 校验 + 对实现执行 → ${status}。详见 job 日志。"
