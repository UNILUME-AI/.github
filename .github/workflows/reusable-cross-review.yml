# Reusable: Claude<->Codex cross review, shared via workflow_call (anti-corrosion: one source for the logic).
# Each repo uses a thin caller shell with the pull_request trigger + permissions + concurrency; review logic lives only here. Usage:
#
#   name: cross-review
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
#       paths-ignore: ['**.md']
#   concurrency:
#     group: cross-review-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions: {}         # zero at workflow level, grant least-privilege per job (SonarCloud GHA rule: permissions belong at job level)
#   jobs:
#     claude-codex:
#       permissions:        # must be >= the union of what the reusable jobs need (reusable perms are capped by the caller)
#         contents: read
#         actions: read
#         pull-requests: write
#         id-token: write
#       # Auto-review switch: only auto-run on PR events when repo/org variable CROSS_REVIEW_AUTO=true (unset by default = off, to save subscription quota);
#       # label events pass through, so adding author:claude / author:codex triggers manually while it is off.
#       if: vars.CROSS_REVIEW_AUTO == 'true' || github.event.action == 'labeled'
#       # Pin the commit SHA (Sonar supply-chain rule: mutable @main refs fail the gate). Get the SHA with:
#       #   gh api repos/UNILUME-AI/.github/commits/main --jq .sha
#       uses: UNILUME-AI/.github/.github/workflows/reusable-cross-review.yml@<commit-sha> # main YYYY-MM-DD
#       secrets:
#         # Pass explicitly, not secrets: inherit (least privilege; Sonar also blocks blanket inherit).
#         CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Structure: single job = one record on PR checks (cross-review / claude-codex / review).
# Routing (detect) is the first step in the job; later steps pick Codex or Claude based on steps.d.outputs.reviewer.
# Routing: Claude authored -> Codex reviews; Codex authored -> Claude reviews; mixed looks at the last commit; human/unsigned -> default Claude.
# Control labels: no-ai-review exempts; author:claude|codex forces the author. Drafts are skipped.
# Triggers/permissions/concurrency/paths-ignore must live in the CALLER: GitHub only runs event workflows from inside the repo, the org .github is not distributed;
# and the reusable perms cannot exceed the caller cap, id-token must be granted by the caller.
#
# Auth (both use subscriptions, org secret, visible to all repos, passed explicitly by the caller):
#   Claude -> CLAUDE_CODE_OAUTH_TOKEN; Codex -> CODEX_AUTH_JSON (full ChatGPT subscription auth.json).
#   WARNING: Codex auth.json contains a refresh token; when it expires, regenerate the secret via `codex login` on a trusted machine.
# Security: on the Codex side an untrusted diff is fed to an agent that can read files, so codex exec runs read-only (no network) +
#   redacts the auth.json token strings from the output before commenting, a double guard against injection leaking credentials.
name: reusable-cross-review

on:
  workflow_call:
    secrets:
      CODEX_AUTH_JSON:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Single job: route first (detect step), then review; occupies only one check on the PR.
  review:
    # Non-label events run as usual; label events only run when a control label changes, so adding an unrelated label does not trigger a review.
    if: >
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["no-ai-review","author:claude","author:codex"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the claude path's claude-code-action loads the github_ci MCP
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # Checkout HEAD_SHA (not refs/pull/N/merge) -- a conflicting PR's merge ref may not exist, this still reviews.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Fetch base tolerantly: if it fails, detect finds no range signatures -> falls back to default Claude (matches the old standalone detect job);
      # if the Codex path is taken, the later Build prompt git diff fails hard and the fallback comment surfaces it, never silently.
      - name: Fetch base ref
        run: git fetch --no-tags origin "$BASE_REF" || true

      # -- Routing: determine author -> pick the "other side" reviewer (codex | claude | none) --
      - name: Detect author -> pick cross reviewer
        id: d
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          # (0) Draft PRs are not auto-reviewed (trigger manually with @claude / @codex if needed)
          if [ "${IS_DRAFT}" = "true" ]; then
            echo "author=draft"  >> "$GITHUB_OUTPUT"
            echo "reviewer=none"  >> "$GITHUB_OUTPUT"
            echo "::notice::draft PR -> skipping auto review"; exit 0
          fi

          # (1) Exemption label (highest priority)
          case ",$LABELS," in
            *",no-ai-review,"*)
              echo "author=exempt" >> "$GITHUB_OUTPUT"
              echo "reviewer=none" >> "$GITHUB_OUTPUT"
              echo "::notice::no-ai-review -> skipping all AI reviews"; exit 0 ;;
          esac

          # (2) Forced author label
          author=""
          case ",$LABELS," in
            *",author:claude,"*) author="claude" ;;
            *",author:codex,"*)  author="codex"  ;;
          esac

          # (3) Scan signatures to determine author; when mixed (both present), route by the last commit
          if [ -z "$author" ]; then
            CLAUDE_PAT='Co-Authored-By: *Claude|noreply@anthropic\.com|Generated with .*Claude Code|claude\[bot\]'
            CODEX_PAT='Co-authored-by: *Codex|noreply@openai\.com|chatgpt-codex-connector'

            all="$(git log --format='%an%x09%ae%x09%cn%x09%ce%x09%B' "${BASE_SHA}..${HEAD_SHA}" || true)"
            all="${all}
          PR_AUTHOR:${PR_AUTHOR}"
            claude=0; codex=0
            printf '%s\n' "$all" | grep -qiE "$CLAUDE_PAT" && claude=1 || true
            printf '%s\n' "$all" | grep -qiE "$CODEX_PAT"  && codex=1  || true

            if   [ "$claude" = 1 ] && [ "$codex" = 0 ]; then author="claude"
            elif [ "$codex"  = 1 ] && [ "$claude" = 0 ]; then author="codex"
            elif [ "$claude" = 1 ] && [ "$codex"  = 1 ]; then
              # Mixed: look only at the last commit (HEAD); whoever wrote it, the other side reviews
              last="$(git log -1 --format='%an%x09%ae%x09%cn%x09%ce%x09%B' "${HEAD_SHA}" || true)"
              lc=0; lx=0
              printf '%s\n' "$last" | grep -qiE "$CLAUDE_PAT" && lc=1 || true
              printf '%s\n' "$last" | grep -qiE "$CODEX_PAT"  && lx=1 || true
              if   [ "$lc" = 1 ] && [ "$lx" = 0 ]; then author="claude"  # last commit Claude -> Codex reviews
              elif [ "$lx" = 1 ] && [ "$lc" = 0 ]; then author="codex"   # last commit Codex  -> Claude reviews
              else author="mixed"   # last commit also ambiguous (human/dual-signed) -> fall back to default Claude
              fi
            else author="unknown"   # unsigned: human, or signing disabled
            fi
          fi

          # (4) Inverse mapping: Claude authored -> Codex reviews; everything else -> default Claude
          case "$author" in
            claude) reviewer="codex"  ;;
            codex)  reviewer="claude" ;;
            *)      reviewer="claude" ;;
          esac
          echo "author=$author"     >> "$GITHUB_OUTPUT"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"
          echo "::notice::author=$author -> reviewer=$reviewer"

      # =========== Codex path (only when the code was authored by Claude) ===========
      - name: Restore Codex auth
        if: steps.d.outputs.reviewer == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/codex_home # the runner context is only usable at step level, not in job env
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "::error::missing CODEX_AUTH_JSON secret (Codex subscription auth.json)"; exit 1
          fi
          mkdir -p "$CODEX_HOME" && chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          # Force file-stored credentials (auth.json); do not look in a keychain/keystore
          printf 'cli_auth_credentials_store = "file"\n' > "$CODEX_HOME/config.toml"

      - name: Build Codex review prompt
        if: steps.d.outputs.reviewer == 'codex'
        run: |
          set -euo pipefail
          {
            printf '%s\n' "You are acting as a reviewer for a proposed code change made by another engineer."
            printf '%s\n' "Focus on issues that impact correctness, performance, security, maintainability, or developer experience."
            printf '%s\n' "Flag only actionable issues introduced by the pull request."
            printf '%s\n' "When you flag an issue, provide a short, direct explanation and cite the affected file and line range."
            printf '%s\n' "Prioritize severe issues and avoid nit-level comments unless they block understanding of the diff."
            printf '%s\n' "After listing findings, produce an overall correctness verdict (\"patch is correct\" or \"patch is incorrect\") with a concise justification and a confidence score between 0 and 1."
            printf '%s\n' "Output your review as GitHub-flavored Markdown."
            echo ""
            echo "Repository: ${REPOSITORY}"
            echo "Pull Request #: ${PR_NUMBER}"
            echo "Base SHA: ${BASE_SHA}"
            echo "Head SHA: ${HEAD_SHA}"
            echo ""
            echo "Changed files:"
            git --no-pager diff --name-status "${BASE_SHA}...${HEAD_SHA}"
            echo ""
            echo "Unified diff (context=5):"
            git --no-pager diff --unified=5 "${BASE_SHA}...${HEAD_SHA}"
          } > codex-prompt.md

      - name: Install Codex CLI
        if: steps.d.outputs.reviewer == 'codex'
        run: npm install -g @openai/codex

      # codex exec runs directly (subscription auth.json); read-only = no network self-exfiltration.
      - name: Run Codex review
        if: steps.d.outputs.reviewer == 'codex'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex_home
        run: |
          set -uo pipefail
          codex exec --sandbox read-only --skip-git-repo-check \
            --output-last-message codex-review-body.md \
            < codex-prompt.md

      # Output present -> redact then post the review; no output -> fallback notice, never silent. always(): post the fallback even if the codex step above failed
      # (if the detect step itself fails, reviewer output is empty and this step does not run -- matches the original two-job version).
      # GH_TOKEN is attached only to this step, to avoid interfering with the claude-code-action token.
      - name: Post Codex result
        if: ${{ always() && steps.d.outputs.reviewer == 'codex' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODEX_HOME: ${{ runner.temp }}/codex_home
        run: |
          set -euo pipefail
          if [ -s codex-review-body.md ]; then
            # Output redaction: literally strip auth.json token strings (>=16 chars) from the review body,
            # to prevent an injection from getting codex to read out credentials and publish them. Longest-first, over-redaction is harmless.
            if [ -f "$CODEX_HOME/auth.json" ]; then
              jq -r '[.. | strings] | map(select(length >= 16)) | .[]' "$CODEX_HOME/auth.json" > redact-toks.txt 2>/dev/null || true
              if [ -s redact-toks.txt ]; then
                python3 -c 'import sys,functools; t=sorted({l.strip() for l in open(sys.argv[1]) if l.strip()},key=len,reverse=True); b=open(sys.argv[2],encoding="utf-8").read(); b=functools.reduce(lambda s,x: s.replace(x,"***REDACTED***"),t,b); open(sys.argv[2],"w",encoding="utf-8").write(b)' redact-toks.txt codex-review-body.md
              fi
            fi
            { echo "## 🤖 Codex review (code authored by Claude)"; echo ""; cat codex-review-body.md; } > codex-comment.md
          else
            {
              echo "## ⚠️ Codex review produced no result"
              echo ""
              echo "codex exec produced no output (subscription auth.json token expired, timeout, or execution error)."
              echo "Check the [run logs](${RUN_URL}) to investigate; if needed, run \`codex login\` again on a trusted machine and update the CODEX_AUTH_JSON secret."
            } > codex-comment.md
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file codex-comment.md

      # =========== Claude path (Codex/human/mixed/unsigned) ===========
      - name: Run Claude review
        if: steps.d.outputs.reviewer == 'claude'
        # gh api repos/anthropics/claude-code-action/commits/v1 --jq .sha
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --allowedTools grants the commenting tools; prompt mode does not auto-post, so it must be explicitly authorized + instructed to publish.
          claude_args: '--model claude-opus-4-8 --max-turns 100 --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_ci__*,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR's code changes, focusing on correctness bugs, edge cases, security, and maintainability.
            Give a verdict by severity 🔴 must-fix / 🟡 suggested / 🟢 optional, cite files and line numbers, and explain the reasoning;
            this is a non-blocking advisory review -- if there are no clear issues, briefly note that it passes, do not pad findings.
            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` to post the top-level verdict; use mcp__github_inline_comment__create_inline_comment(confirmed: true) for inline comments on specific lines.
            Only post GitHub comments; do not return the review body as a message.
