# Reusable: @claude handler, shared via workflow_call (anti-corrosion: one source for the logic).
# A repo enables @claude with a ~20-line caller that wires the event triggers + permissions and
# delegates here; the @claude filter and claude-code-action config live ONCE, in this file. Usage:
#
#   on:
#     issue_comment: { types: [created] }
#     pull_request_review_comment: { types: [created] }
#     pull_request_review: { types: [submitted] }
#     issues: { types: [opened, assigned] }
#   permissions:
#     contents: write
#     actions: read
#     checks: read
#     pull-requests: write
#     issues: write
#     id-token: write
#   jobs:
#     claude:
#       # Pin to a commit SHA (Sonar supply-chain rule: mutable @main refs fail the gate).
#       # Get the SHA to pin (rerun when upgrading the reusable):
#       #   gh api repos/UNILUME-AI/.github/commits/main --jq .sha
#       uses: UNILUME-AI/.github/.github/workflows/reusable-claude.yml@<commit-sha> # main YYYY-MM-DD
#       secrets:
#         # Pass explicitly, not `secrets: inherit` — this is the only secret declared below;
#         # least privilege, and Sonar flags blanket inherit.
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Why the caller still needs triggers + permissions (cannot be fully hidden here):
#   - Triggers live in the CALLER: GitHub only runs a repo's own event workflows; the org `.github`
#     repo does NOT auto-propagate workflows (only profile/templates). Each repo registers its own
#     issue_comment / PR-review triggers locally.
#   - id-token: write must be granted at the CALLER level: a reusable workflow's permissions are
#     capped by the caller's ceiling and cannot be elevated beyond it.
#   - actions: read enables the github_ci MCP server (CI status / job logs). Same capping rule:
#     declare it here AND grant it in the caller, else it falls back to none.
#   - checks: read lets @claude read Check annotations (e.g. SonarCloud findings) via gh api.
#     Same capping rule: declare here AND in the caller.
# Needs secret CLAUDE_CODE_OAUTH_TOKEN (org secret, all-repos visible); callers pass it
# explicitly (see Usage above), not via `secrets: inherit`.
name: reusable-claude

on:
  workflow_call:
    inputs:
      claude_args:
        description: "Extra args for claude-code-action, e.g. --model claude-opus-4-8 --max-turns 15. Empty = action default (Sonnet)."
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    # 过滤:评论 / Issue 正文里 @claude 才触发。reusable workflow 内 github.event.* 反映 caller
    # 的触发事件,故过滤放这里、各 caller 不必重复。
    # 触发者授权由 claude-code-action 内置校验把关——仅有仓库写权限者能真正跑起来;
    # 不要加 author_association 闸:private org 成员在 webhook 载荷里会被显示成 NONE 而被误挡。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 默认 360 分钟；卡死作业会按 6 小时计费
    permissions:
      contents: write
      actions: read # enables github_ci MCP (CI status / job logs); caller must grant it too
      checks: read # lets @claude read Check annotations (e.g. SonarCloud findings); caller must grant it too
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # 这里**故意**保留凭证持久化。claude-code-action 放行 `Bash(git:*)`，@claude 修完代码要
      # 提交并推回分支；关掉持久化会让它推不动。与 reusable-ai-unit-tests 里那两处同类改动的
      # 区别在可验证性：那边的 push 用显式 token 拼完整 URL，静态就能断定不受影响；这里要真的
      # @claude 跑一次才知道，本 PR 验证不了——不能验证的改动不塞进来。
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # 跨仓共享的 agent 资产,业务仓不存副本(见 UNILUME-AI/agent-kit 的 README)。
      # 内容必须钉死在一个 commit 上,理由同「action 一律钉 SHA」:本 job 有 contents
      # 与 pull-requests 写权限、且放行 git/gh,而 skill 是能左右 agent 行为的文本——
      # 引用可变分支时,agent-kit 的任何改动都会未经本仓评审直接进入这个特权 job。
      # 升级 skill = 改下面的 SHA(走本仓评审),各仓再 bump 本 workflow 的 SHA:
      #   gh api repos/UNILUME-AI/agent-kit/commits/main --jq .sha
      #
      # 取到 RUNNER_TEMP 而非工作区:放工作区会成为一个嵌套 git 仓,@claude 的
      # git add 可能把它作为 gitlink 提交进业务仓。
      # 用 git init + fetch <sha> 而非 actions/checkout:后者的 path 必须位于工作区内。
      - name: Fetch shared agent skills (pinned)
        env:
          AGENT_KIT_SHA: e91224b253a20e3d5dbe41ef69036a8dc754639e # main 2026-07-29
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/agent-kit"
          git -C "$RUNNER_TEMP/agent-kit" remote add origin https://github.com/UNILUME-AI/agent-kit.git
          git -C "$RUNNER_TEMP/agent-kit" fetch -q --depth 1 origin "$AGENT_KIT_SHA"
          git -C "$RUNNER_TEMP/agent-kit" checkout -q FETCH_HEAD

      - name: Run Claude Code
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          # 订阅授权(Pro/Max),org secret(all 仓可见)。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 默认 Sonnet;caller 传 claude_args 可切 Opus 等。
          claude_args: ${{ inputs.claude_args }}
          # 传本地路径而非 git URL:action 的 install-plugins.ts 只 spawn
          # `claude plugin marketplace add <输入>`,对 URL 形式不接受任何 ref/tag
          # (校验正则要求以 .git 结尾),因此 URL 形式无法钉版本;本地路径形式则由
          # 上一步按 SHA 取好,是不可变的。
          plugin_marketplaces: ${{ runner.temp }}/agent-kit
          plugins: unilume-workflow@agent-kit
          # 现签的 Claude-App 安装令牌默认只带 contents/pull_requests/issues
          # (claude-code-action token.ts 的 DEFAULT_PERMISSIONS)。job 级 permissions
          # 只管默认 GITHUB_TOKEN,agent 的 gh 用的是这枚 app token,故须在此把
          # actions/checks 追加进 app token,否则:
          #   - mcp__github_ci(查 CI 状态/日志)缺 actions scope 而降级;
          #   - gh api check-runs/{id}/annotations 读 SonarCloud 注解 → 403。
          # 追加权限受 caller 的 job permissions 上限约束(已声明 actions/checks: read)。
          additional_permissions: |
            actions: read
            checks: read
