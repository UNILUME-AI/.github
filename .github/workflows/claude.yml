name: Claude Code

# 仅在评论 / Issue 中 @claude 时触发(不自动跑每个 PR,省额度)。
# 逻辑(@claude 过滤 + claude-code-action)已抽到 reusable-claude.yml;本文件只留触发器 +
# 权限 + 委派。触发器与 id-token 权限必须留在各仓本地(GitHub 只跑仓库内的事件 workflow,
# org .github 不下发 workflow;reusable 不能提权超过 caller 上限)。
# 注意:issue_comment 类触发要求本 workflow 先在默认分支才生效。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# 本仓也是 reusable-claude 的一个 caller,故须与其余消费仓同样声明 actions/checks——
# reusable 的 permissions 受 caller 上限截断,caller 不写就是 none,被调方声明多少都无效。
permissions:
  contents: write
  actions: read # github_ci MCP(CI 状态/日志)
  checks: read # 读 Check 注解(SonarCloud 等)
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # 钉死 commit SHA，与其余 14 个消费仓一致。本仓自引用同样不能用 @main：可变引用正是
    # CVE-2025-30066（tj-actions/changed-files）的利用面——攻击者把已有引用重新指向恶意提交，
    # 所有浮动引用下一次 CI 就拉到后门。本仓公开后这一点更实在。升级 reusable 时改此 SHA：
    # gh api repos/UNILUME-AI/.github/commits/main --jq .sha
    # 同仓引用走本地路径，不写 owner/repo@sha。GitHub 对 `./` 形式从**调用方所在的
    # 那次提交**解析被调 workflow：既在单次运行内不可变，又不会指回更早的提交。
    # 这里写 @sha 反而是错的——钉的必然是父提交，于是同一个 PR 里对 reusable 的改动
    # 对本仓自己不生效，要等下一次改 pin 才生效。业务仓侧仍钉 SHA：那是跨仓引用。
    uses: ./.github/workflows/reusable-claude.yml
    secrets:
      # 显式传递而非 inherit：reusable 只声明了这一个 secret，最小权限。
      # reusable-claude.yml 的文件头本就写明「callers pass it explicitly, not via secrets: inherit」，
      # 本仓此前是唯一没照做的调用方。
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
