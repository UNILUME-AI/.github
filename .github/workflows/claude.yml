name: Claude Code

# 仅在评论 / Issue 中 @claude 时触发(不自动跑每个 PR,省额度)。
# 逻辑(@claude 过滤 + claude-code-action)已抽到 reusable-claude.yml;本文件只留触发器 +
# 权限 + 委派。触发器与 id-token 权限必须留在各仓本地(GitHub 只跑仓库内的事件 workflow,
# org .github 不下发 workflow;reusable 不能提权超过 caller 上限)。
# 注意:issue_comment 类触发要求本 workflow 先在默认分支才生效。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    uses: UNILUME-AI/.github/.github/workflows/reusable-claude.yml@main
    secrets: inherit
