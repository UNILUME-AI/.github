name: reusable-spec-hygiene

# 防腐门 (anti-corrosion gate) for `specs/NNN/` artifacts, shared via workflow_call.
# It is the CI backstop the constitution already requires but never had: 铁律 VI.3 asks for
# frontmatter (owner/status/last_reviewed) plus "由 CI 检测失效链接与超期未复审", and 铁律 VII
# says a rule without a CI or PR gate behind it is not a rule. Until this file existed, VI.3
# was itself an unbacked rule — and it decayed exactly as VII predicts: 32 of 45 specs across
# the org still said `status: draft`, several of them for features that had shipped weeks
# earlier, and every `last_reviewed` was frozen at the day the spec was created.
#
# A business repo wires it as a REQUIRED check:
#
#   # .github/workflows/ci.yml
#   jobs:
#     spec-hygiene:
#       uses: UNILUME-AI/.github/.github/workflows/reusable-spec-hygiene.yml@<full-sha>
#
# The whole check is inlined below rather than shipped as a script. A reusable workflow runs
# from THIS repo while `actions/checkout` gets the CALLER's repo, so a script would need a
# second checkout of this repo at a matching ref — two things to pin instead of one, and a
# silent skew the day they disagree. Inline keeps "one SHA pins everything" true.
#
# Pure filesystem checks: no network, no secrets, works on the default GITHUB_TOKEN and on
# fork PRs. Inputs reach bash through env, never interpolated into `run:`.

on:
  workflow_call:
    inputs:
      specs-dir:
        description: Root holding the per-feature spec directories.
        type: string
        default: specs
      stale-days:
        description: Age at which `last_reviewed` is reported as overdue (warning only).
        type: number
        default: 90

permissions:
  contents: read

jobs:
  spec-hygiene:        # job id = 状态检查上下文(与分支保护对齐)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 默认 360 分钟；卡死作业会按 6 小时计费
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 需要 base 与 head 才能 diff 出本次改了哪些 spec
          # 不把 git 凭证留在 .git/config：残留凭证会被后续 step 或 artifact 带走（zizmor artipacked）。
          persist-credentials: false

      # 阻断项只看本次 PR 改到的 spec。存量不合规的那些由一次性整理修，不该让每个无关 PR 都红——
      # 那样门会被当成噪音关掉，而不是被遵守。
      - name: Validate changed specs
        env:
          SPECS_DIR: ${{ inputs.specs-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$SPECS_DIR" | grep -E '\.md$' || true)"
          if [ -z "${changed//[[:space:]]/}" ]; then
            echo "no spec docs changed — nothing to block on"
            exit 0
          fi
          echo "changed spec docs:"; echo "$changed"
          CHANGED="$changed" python3 - <<'PY'
          import os, pathlib, re, datetime, sys

          # 与 scrum 的 Theme/Epic 词表同源，另加两个 spec 独有态：
          #   superseded — 实现已走过这份规格冻结的决定（正文加注，规格本身不改写）
          #   moved      — 规格已随其描述的代码迁往他仓，本仓只留索引
          VALID = {"proposed", "active", "paused", "done", "abandoned", "superseded", "moved"}
          LINK = re.compile(r'\]\(([^)\s#]+\.md)(#[^)]*)?\)')

          fail = 0
          def bad(f, msg):
              global fail
              print(f"::error file={f}::{msg}")
              fail = 1

          def field(text, key):
              for line in text.splitlines()[:20]:
                  if line.startswith(key + ":"):
                      return line[len(key) + 1:].strip().strip("\"'")
              return ""

          for name in os.environ["CHANGED"].split("\n"):
              name = name.strip()
              if not name:
                  continue
              f = pathlib.Path(name)
              if not f.is_file():          # 本次删除的文件不必校验
                  continue
              if f.name == "README.md":
                  continue
              text = f.read_text(encoding="utf-8", errors="replace")

              # 未决标记不得进主干。放在这里而不是靠 vale，是因为只有部分仓装了 docs-style。
              if "[NEEDS CLARIFICATION" in text:
                  bad(f, "residual [NEEDS CLARIFICATION] marker(s)")

              # 失效相对链接。全组织现存 119 条相对链接、0 条失效，所以设为阻断级今天零成本；
              # 若哪天它开始误伤（例如指向尚未落地的兄弟文件），降级为告警而不是关掉整道门。
              for m in LINK.finditer(text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "/")):
                      continue
                  if not (f.parent / target).exists():
                      bad(f, f"失效相对链接 → {target}")

              # frontmatter 三字段只对 spec.md 要求：plan/tasks/research 是派生件，
              # 状态由所属 spec.md 承载，逐个文件各带一份反而会各自漂移。
              if f.name != "spec.md":
                  continue

              st, ow, lr = field(text, "status"), field(text, "owner"), field(text, "last_reviewed")
              if not st:
                  bad(f, "frontmatter 缺 status")
              elif st not in VALID:
                  bad(f, f"status 取值非法 '{st}'（可用：{' '.join(sorted(VALID))}）")
              if not ow:
                  bad(f, "frontmatter 缺 owner")
              if not lr:
                  bad(f, "frontmatter 缺 last_reviewed")
              else:
                  # 必须做日历语义校验，不能只比形状。'2026-02-31' 能过 \d{4}-\d{2}-\d{2}，
                  # 却在超期计算里抛 ValueError——那条 spec 从此永远不会被判超期，而门是绿的。
                  # 一个恒不触发的检查比没有检查更糟：它看起来在守着。
                  try:
                      datetime.date.fromisoformat(lr)
                  except ValueError:
                      bad(f, f"last_reviewed 不是合法日历日期 '{lr}'（需 YYYY-MM-DD）")

          if fail:
              print("::error::spec 防腐门未通过")
              sys.exit(1)
          print("changed specs OK")
          PY

      # 全量扫描只报不拦：让存量腐化持续可见，而不是把它藏进一次性任务里。
      #
      # 两个步骤都用 python3 而非 bash + date。`date -u -d` 是 GNU 语法，在 runner 上能跑但在
      # macOS 的 BSD date 上直接报错——也就是说日期逻辑本地无法忠实预演。python3 在
      # ubuntu-latest 与开发机上都有，同一份代码两地同结果，所以本地测就等于测了 CI。
      - name: Report stale specs (non-blocking)
        if: always()
        env:
          SPECS_DIR: ${{ inputs.specs-dir }}
          STALE_DAYS: ${{ inputs.stale-days }}
        run: |
          python3 - <<'PY'
          import os, pathlib, datetime
          root = pathlib.Path(os.environ["SPECS_DIR"])
          # workflow_call 的 `type: number` 允许小数，调用方给 90.5 是合法输入。直接 int()
          # 会抛 ValueError 并让这个「非阻断」步骤把整个 job 弄红——报告用的检查反而成了门。
          limit = int(float(os.environ["STALE_DAYS"]))
          today = datetime.date.today()

          def field(text, key):
              for line in text.splitlines()[:20]:
                  if line.startswith(key + ":"):
                      return line[len(key) + 1:].strip().strip("\"'")
              return ""

          rows = []
          for f in sorted(root.rglob("spec.md")) if root.is_dir() else []:
              text = f.read_text(encoding="utf-8", errors="replace")
              st, lr = field(text, "status"), field(text, "last_reviewed")
              flags, days = [], None
              if not st:
                  flags.append("缺 status")
              if not lr:
                  flags.append("缺 last_reviewed")
              else:
                  try:
                      days = (today - datetime.date.fromisoformat(lr)).days
                      if days > limit:
                          flags.append(f"超期 {limit} 天")
                  except ValueError:
                      flags.append(f"last_reviewed 不可解析 '{lr}'")
              if flags:
                  rows.append((str(f), st or "∅", lr or "∅", days, " / ".join(flags)))

          summary = pathlib.Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"))
          with summary.open("a", encoding="utf-8") as out:
              out.write("### spec 防腐扫描\n\n")
              if not rows:
                  out.write("全部 spec 的 status 与 last_reviewed 均合规。\n")
              else:
                  out.write("| spec | status | last_reviewed | 天数 | 问题 |\n|---|---|---|---|---|\n")
                  for p, st, lr, days, why in rows:
                      out.write(f"| `{p}` | {st} | {lr} | {days if days is not None else '—'} | {why} |\n")
          for p, _, _, _, why in rows:
              print(f"::warning file={p}::{why}")
          print(f"需关注的 spec: {len(rows)}")
          PY
