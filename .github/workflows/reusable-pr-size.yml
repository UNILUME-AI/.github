# PR 体量提醒（非阻断）。
#
# 为什么需要：本组织人类评审覆盖率约 1.4%，多数 PR 由 AI 生成并零评审合并。
# LinearB 2026 基于 810 万 PR 的结论是「PR 体量是速度最显著的驱动因素」，
# 而体量是当前唯一还能被机器观测到的「人是否看得过来」的代理指标。
#
# 为什么不设为必需检查：阈值来自经验法则而非一手研究（「200–400 行发现 70–90% 缺陷」
# 这一说法查不到原始出处），把无法自动判定的东西做成硬门只会制造绕过。本 workflow
# 恒定 exit 0，只打标签 + 写 job summary。
#
# 调用方式（放在各仓 .github/workflows/pr-size.yml）：
#   on:
#     pull_request:
#       # edited 覆盖「换基分支」——那会大幅改变体量，而默认活动类型不含它。
#       # 本文件内部会把「改标题/正文」那种 edited 过滤掉，调用方无需操心。
#       types: [opened, synchronize, reopened, edited]
#   permissions: {}
#   jobs:
#     size:
#       uses: UNILUME-AI/.github/.github/workflows/reusable-pr-size.yml@<commit-sha> # vX.Y.Z
#       permissions:
#         pull-requests: write
#         issues: write
#
# 调用桩刻意只有这三样（on / uses / permissions）：跳过判据与全部逻辑都在本文件里，
# 改动只需动这一处 + 打新 tag，各仓由 Dependabot 自动收到 re-pin PR。

on:
  workflow_call:
    inputs:
      threshold:
        description: '触发提醒的变更行数阈值（additions + deletions）'
        type: number
        required: false
        # 1000 行。按 2026-05~07 的 441 个已合并 PR 回测，约 8% 会触发（P90 为 899 行）。
        # 定位是「异常大」的告警而非「偏大」的提醒——阈值定低了会天天响，响多了就没人看。
        default: 1000

permissions: {}

jobs:
  pr-size:
    # 跳过判据放在这里而不是各调用方的 pr-size.yml：判据变一次就要改 N 个仓，
    # 而调用桩本该是「一次写好、之后只随 tag 升级」的东西。放这里之后，逻辑
    # 与判据都成了单点，调用桩只剩 on: / uses: / permissions 三样。
    #
    # ① dependabot[bot] 开的 PR 里 GITHUB_TOKEN 会被降为只读（GitHub 的既定行为，
    #    私有仓同样适用）。当前各仓只开了 github-actions 生态、每个 PR 只有 2 行，
    #    走不到需要写权限的超标分支；但一旦开 npm/pip，一次 lockfile 变更就可能上千行，
    #    届时会在每个 Dependabot PR 上留一个红检查。直接跳过——机器生成的依赖升级
    #    本来也不需要「人是否看得过来」这个信号。
    #    判据用 pull_request.user.login 而非 github.actor：后者是「触发本次事件的人」，
    #    维护者 reopen 或换基分支时它就变成维护者了，守卫会漏。我们要跳过的是
    #    「Dependabot 开的 PR」，不是「由 Dependabot 触发的事件」。
    # ② 调用方把 edited 加进 types 是为了覆盖「换基分支」——那会大幅改变体量，
    #    而默认活动类型不含 edited。但 edited 同样由改标题/正文触发，那种情况体量
    #    没变、重跑纯属白烧 Actions 分钟（计费按 job 次数向上取整，短 job 也算满
    #    1 分钟）。event.changes.base 只在换基分支时存在，用它把两种 edited 分开。
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && (github.event.action != 'edited' || github.event.changes.base != null)
    # 标签是本 job 唯一的外部可见状态，而它读的是 event payload 里的体量快照。
    # 连续推送时若两次运行重叠，旧的「超标」运行可能在新的「未超标」运行清掉标签之后
    # 才执行 add，把 size/XL 留在一个小 PR 上。取消在跑的旧运行让最新状态永远胜出。
    # 放 job 级而非 workflow 级：本文件是 reusable，workflow 级并发不受调用方约束，
    # 而 job 级在每个调用方仓库内各自成组。
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # gh pr edit --add-label
      issues: write # gh label create——GitHub 的 label 端点归 Issues 权限，缺了会被拒且 set -e 直接终止本 step
    steps:
      - name: Flag oversized pull request
        env:
          # 全部经 env 传入：不把 ${{ }} 直接插进 shell（防脚本注入）。
          # 这几个值本身是数字/仓库名，但保持统一写法。
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
          THRESHOLD: ${{ inputs.threshold }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABEL: size/XL
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total=$(( ADDITIONS + DELETIONS ))
          # inputs 声明的 type: number 允许小数，而 [ -le ] 只吃整数：threshold=1000.5 会让
          # 测试报 "integer expression expected" 并返回非零，在 if 里就等同于「超标」——
          # 一个 1000 行的 PR 会被静默地误打上标签，而报错只进 stderr 没人看。截断成整数，
          # 让实际行为与声明的入参类型对齐。
          threshold=${THRESHOLD%%.*}
          echo "变更 ${total} 行（+${ADDITIONS} / -${DELETIONS}），涉及 ${FILES} 个文件；阈值 ${threshold}。"
          {
            echo "### PR 体量"
            echo ""
            echo "| 变更行数 | 新增 | 删除 | 文件数 | 阈值 |"
            echo "|---:|---:|---:|---:|---:|"
            echo "| ${total} | ${ADDITIONS} | ${DELETIONS} | ${FILES} | ${threshold} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 本 job 在每次 synchronize 上重跑，所以两个分支都必须把标签调成与当前体量一致——
          # 只加不删会让缩回阈值内的 PR 一直挂着 size/XL，标签比 job summary 更显眼，
          # 过期的标签比没有标签更误导人。
          if [ "$total" -le "$threshold" ]; then
            echo "✅ 在阈值内。" >> "$GITHUB_STEP_SUMMARY"
            # 查询结果必须单独捕获：若把 `gh pr view | grep` 整个塞进 if 条件，
            # 「查询失败」与「标签不存在」返回同样的非零码，一次瞬时 API 或鉴权故障
            # 就会被当成「本来就没标签」而跳过移除，留下陈旧标签且检查仍报绿。
            if labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name'); then
              if grep -qxF "$LABEL" <<<"$labels"; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$LABEL"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "（PR 已缩回阈值内，先前的 \`${LABEL}\` 标签已移除。）" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              # 不升级为 job 失败——本 job 定位是非阻断提醒，不该因一次读取失败变成
              # 失败源；但必须留下可见痕迹，否则「标签没同步」会无声无息。
              echo "::warning::读取 PR 标签失败，本次跳过标签同步；若 ${LABEL} 已存在则可能残留。"
              {
                echo ""
                echo "⚠️ 读取标签失败，未能确认 \`${LABEL}\` 是否需要移除——请以本表的行数为准。"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ **超过阈值。** 大 PR 在零人评审下直通主干是当前最大的质量敞口——" \
               "合并前请确认 codex 的评审已覆盖，或考虑拆分。" >> "$GITHUB_STEP_SUMMARY"

          # --force 使命令幂等：标签已存在时不报错。
          gh label create "$LABEL" --repo "$REPO" --color D93F0B \
            --description "变更超过 ${threshold} 行" --force
          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
