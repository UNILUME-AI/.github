# 只开 github-actions 生态：本文件的目的是防 tj-actions/changed-files 那类供应链攻击
# (CVE-2025-30066，攻击者把已有版本标签重新指向恶意提交)。第三方 action 一律固定到 40 位
# commit SHA，Dependabot 会连同其后的 `# vX.Y.Z` 注释一起更新，使固定不会随时间腐化。
# 不开 npm/pip 生态：那会淹没 PR 列表，且业务依赖升级另有节奏。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 冷却期：不追刚发布的版本。被投毒的发布最危险的窗口就是刚上线那几天——
    # 等 7 天让社区先踩，是这类供应链攻击最便宜的缓解手段。zizmor 的
    # dependabot-cooldown 审计会强制这一条。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
